[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader"
version = "0.1.0"
description = "Asynchronous PySide6/qasync desktop downloader for HLS video streams"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    # Pinned to known-green fork commits. Do not switch these to branch refs:
    # the point of the pin is a reproducible dependency state.
    # [hls] pulls m3u8 + av, which the segment download and the TS->MP4 remux need.
    "eaf_base_api[hls] @ git+https://github.com/PappenHeim10/eaf_base_api.git@510d391",
    "xhamster_api @ git+https://github.com/PappenHeim10/unofficial-api-for-xhamster.git@a18cd7b",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-qt",
    "pytest-timeout",
    "PyInstaller>=6.10",
    # Task runner for [tool.poe.tasks]; the project itself never imports it.
    "poethepoet>=0.24",
]

[project.scripts]
video-downloader = "video_downloader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Project commands, run with `poe <task>`; a bare `poe` lists them.
# These are shortcuts, not a second entry point: every task invokes the same
# module or script a developer would call by hand, so nothing can drift into
# only working through the task runner.
[tool.poe.tasks]
run = { cmd = "python -m video_downloader", help = "GUI aus dem Quellcode starten" }
debug = { cmd = "python debug_main.py", help = "GUI mit Debug-Logging starten (Entry Point des Debug-Builds)" }
cli = { cmd = "python -m video_downloader.cli.console_app", help = "Konsolen-Downloader; Argumente werden durchgereicht, z. B. poe cli <URL> -q best" }
smoke = { cmd = "python -m video_downloader --smoke-test", help = "Startpfad pruefen, ohne ein Fenster zu oeffnen" }
# PYTHONPATH mirrors build.py: the repo root is on the path so tests/packaging
# can import debug_main.py, and src/ deliberately is not - the tests must run
# against the installed distribution, not against the source tree.
test = { cmd = "pytest tests", env = { PYTHONPATH = "." }, help = "Testsuite ausfuehren" }
build = { cmd = "python build.py dev", help = "Debug-Build nach dist/dev (Tests, PyInstaller, Smoke-Test)" }
release = { cmd = "python build.py release", help = "Release-Build nach dist/release (immer clean)" }

[tool.pytest.ini_options]
timeout = 30
